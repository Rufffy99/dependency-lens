name: Publish VS Code Extension

on:
  push:
    branches:
      - main

concurrency:
  group: vscode-publish-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Detect version bump in package.json
        id: version_check
        shell: bash
        run: |
          set -euo pipefail

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          BEFORE_SHA='${{ github.event.before }}'
          REF_NAME='${{ github.ref_name }}'
          if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "::warning::github.event.before is all-zero. Skipping publish to avoid accidental re-publish without a verified version bump."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            # Avoid full-history fetch: deepen the branch ref incrementally.
            for depth in 50 200; do
              git fetch --no-tags --deepen="$depth" origin "$REF_NAME" || true
              if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
                break
              fi
            done
          fi

          if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "::warning::Could not resolve github.event.before ($BEFORE_SHA). Skipping publish to avoid accidental re-publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$BEFORE_SHA":package.json 2>/dev/null; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_VERSION=$(git show "$BEFORE_SHA":package.json | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8')).version)")

          if [[ "$OLD_VERSION" != "$NEW_VERSION" ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip publish when version is unchanged
        if: steps.version_check.outputs.should_publish != 'true'
        run: echo "Skipping publish because package.json version did not change."

      - name: Install dependencies
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm ci

      - name: Run lint (includes type checks)
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm run lint

      - name: Run unit tests
        if: steps.version_check.outputs.should_publish == 'true'
        run: |
          npm run compile-tests
          npx mocha 'out/test/**/*.test.js'

      - name: Validate VSCE_PAT secret
        if: steps.version_check.outputs.should_publish == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "${VSCE_PAT:-}" ]]; then
            echo "::error::Missing required secret VSCE_PAT. Add it in GitHub repository settings under Secrets and variables > Actions."
            exit 1
          fi

      - name: Publish to VS Code Marketplace
        if: steps.version_check.outputs.should_publish == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm exec -- vsce publish -p "$VSCE_PAT"
